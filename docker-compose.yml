services:
  # ==========================================
  # 🍃 MongoDB - Base de Datos Principal NoSQL
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: weightcontrol_mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongodb_data:/data/db
    networks:
      - weightcontrol_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # ⚡ Redis - Caché en Memoria y Sesiones
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: weightcontrol_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - weightcontrol_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 🖥️ Mongo Express - Interfaz Web para MongoDB
  # (Accesible en http://localhost:8081)
  # ==========================================
  mongo-express:
    image: mongo-express:latest
    container_name: weightcontrol_mongo_express
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - weightcontrol_network

  # ==========================================
  # 🖥️ Redis Commander - Interfaz Web para Redis
  # (Accesible en http://localhost:8082)
  # ==========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: weightcontrol_redis_commander
    restart: unless-stopped
    ports:
      - "${REDIS_COMMANDER_PORT:-8082}:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - weightcontrol_network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  weightcontrol_network:
    driver: bridge
